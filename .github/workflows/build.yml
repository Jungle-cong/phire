name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: 创建 .env（dotenv_build 必需）
        run: touch .env

      - name: 给 phire-main 加 Android 元数据
        run: |
          cat >> phire-main/Cargo.toml <<'EOF'

          [package.metadata.android]
          package = "com.phire.app"
          target_sdk_version = 33
          min_sdk_version = 24
          EOF

      - name: 禁用 video feature（绕开 prpr-avc 静态库）
        run: sed -i 's/^phire = { workspace = true }$/phire = { workspace = true, default-features = false, features = ["log", "play"] }/' phire-ui/Cargo.toml

      - name: openssl 改 vendored（Android 交叉编译必需）
        run: sed -i 's/^openssl = "0.10.73"/openssl = { version = "0.10.73", features = ["vendored"] }/' Cargo.toml

      - name: 安装 cargo-apk
        run: cargo install cargo-apk --locked

      - name: 构建 APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo apk build --release -p phire-main --target aarch64-linux-android

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: phire.apk
          path: target/aarch64-linux-android/release/apk/*.apk
